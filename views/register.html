<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TaskMaster</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232563EB'/%3E%3Cpath d='M28 52l16 16 30-34' stroke='white' stroke-width='12' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <script>
        // Apply dark mode before render (persistent preference, no flash)
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-950/80 backdrop-blur border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <div class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-blue-600">
                    <i class="fas fa-check-double text-white text-sm"></i>
                </div>
                <span class="text-lg font-bold text-slate-800 dark:text-slate-100">TaskMaster</span>
            </a>
            <nav class="flex items-center gap-2 sm:gap-3">
                <a href="/login" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Log In</a>
                <a href="/register" class="px-4 py-2 rounded-xl text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700 transition shadow-lg shadow-blue-200 dark:shadow-none">Sign Up Free</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md">

        <!-- Branding -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-600 shadow-lg shadow-blue-200 dark:shadow-none mb-4">
                <i class="fas fa-check-double text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 dark:text-slate-100">TaskMaster</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-1">Create your free account</p>
        </div>

        <!-- Register Card -->
        <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-lg shadow-slate-200 dark:shadow-slate-950 p-5 sm:p-8">

            <!-- Error / info message -->
            <div id="message" class="hidden mb-4 p-4 rounded-xl border border-red-200 bg-red-50 text-red-700 dark:border-red-800 dark:bg-red-900/30 dark:text-red-300 text-sm"></div>

            <form id="registerForm" novalidate>
                <div class="mb-5">
                    <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Name</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="name" name="name" placeholder="Your full name"
                               class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900/40 outline-none transition">
                    </div>
                    <p id="nameHint" class="hidden mt-1.5 text-xs text-red-500 flex items-center gap-1"><i class="fas fa-circle-exclamation"></i><span></span></p>
                </div>

                <div class="mb-5">
                    <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com"
                               class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900/40 outline-none transition">
                    </div>
                    <p id="emailHint" class="hidden mt-1.5 text-xs text-red-500 flex items-center gap-1"><i class="fas fa-circle-exclamation"></i><span></span></p>
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="password" id="password" name="password" placeholder="At least 6 characters"
                               class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 dark:focus:ring-blue-900/40 outline-none transition">
                    </div>
                    <p id="passwordHint" class="hidden mt-1.5 text-xs text-red-500 flex items-center gap-1"><i class="fas fa-circle-exclamation"></i><span></span></p>
                </div>

                <button type="submit" id="submitBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold py-3 rounded-xl transition shadow-md shadow-blue-200">
                    Create Account
                </button>
            </form>

            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6">
                Already have an account?
                <a href="/login" class="text-blue-600 font-semibold hover:underline">Log In</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 grid grid-cols-1 sm:grid-cols-3 gap-6">
            <div>
                <a href="/" class="flex items-center gap-2">
                    <div class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-blue-600">
                        <i class="fas fa-check-double text-white text-xs"></i>
                    </div>
                    <span class="font-bold text-slate-800 dark:text-slate-100">TaskMaster</span>
                </a>
                <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">Organize, track, and complete your tasks.</p>
            </div>
            <div>
                <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-800 dark:text-slate-100 mb-3">Quick Links</h4>
                <ul class="space-y-2 text-sm">
                    <li><a href="/" class="text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition">Home</a></li>
                    <li><a href="/login" class="text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition">Log In</a></li>
                    <li><a href="/dashboard" class="text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition">Dashboard</a></li>
                </ul>
            </div>
            <div>
                <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-800 dark:text-slate-100 mb-3">Follow Us</h4>
                <div class="flex items-center gap-2.5">
                    <a href="#" aria-label="GitHub" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 transition"><i class="fab fa-github"></i></a>
                    <a href="#" aria-label="Facebook" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 transition"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" aria-label="Twitter" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 transition"><i class="fab fa-x-twitter"></i></a>
                    <a href="#" aria-label="Instagram" class="w-9 h-9 rounded-xl flex items-center justify-center bg-slate-100 dark:bg-slate-900 text-slate-500 dark:text-slate-400 hover:bg-blue-600 hover:text-white dark:hover:bg-blue-600 transition"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>
        <div class="border-t border-slate-200 dark:border-slate-800 py-4">
            <p class="text-center text-xs text-slate-400 dark:text-slate-500">&copy; 2026 TaskMaster. All rights reserved.</p>
        </div>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
